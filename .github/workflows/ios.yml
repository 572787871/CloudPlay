name: CloudPlay iOS 未签名 IPA
on:
  workflow_dispatch:
    inputs:
      run_device:
        description: 编译真机 IPA
        type: boolean
        default: true
      run_tests:
        description: 运行单元、联调与界面测试
        type: boolean
        default: true
  push:
    paths: ["App/**", "ShareExtension/**", "Tests/**", "UITests/**", "Scripts/**", "CloudPlay.xcodeproj/**", "Podfile", "Podfile.lock", ".github/workflows/ios.yml"]
permissions:
  contents: read
concurrency:
  group: cloudplay-ios-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.run_tests == false && 'device' || 'full' }}
  cancel-in-progress: true
jobs:
  device:
    if: github.event_name != 'workflow_dispatch' || inputs.run_device
    runs-on: macos-26-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: 安装真实播放器依赖
        run: |
          set -o pipefail
          mkdir -p build/logs
          xcodebuild -version | tee build/logs/xcode-version.log
          pod install --repo-update 2>&1 | tee build/logs/pod-install.log
      - name: 编译并验证 iOS arm64 IPA
        id: package
        run: |
          set -o pipefail
          xcodebuild build -workspace CloudPlay.xcworkspace -scheme CloudPlay -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/Device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee build/logs/ios-device.log
          python3 Scripts/package_ipa.py build/Device/Build/Products/Release-iphoneos/CloudPlay.app build/CloudPlay-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CloudPlay-device-build-logs
          path: |
            Podfile.lock
            build/logs/
      - uses: actions/upload-artifact@v4
        if: steps.package.outcome == 'success'
        with:
          name: CloudPlay-unsigned-IPA
          path: build/CloudPlay-unsigned.ipa
          if-no-files-found: error
  tests:
    if: github.event_name != 'workflow_dispatch' || inputs.run_tests
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: |
          set -o pipefail
          mkdir -p build/logs
          pod install --repo-update 2>&1 | tee build/logs/pod-install.log
      - name: 运行 iOS 单元、联调与界面测试
        env:
          TEST_RUNNER_CLOUDPLAY_TEST_BASE: https://cl.520123.xyz
          TEST_RUNNER_CLOUDPLAY_TEST_USER: ${{ secrets.CLOUDPLAY_TEST_USER }}
          TEST_RUNNER_CLOUDPLAY_TEST_PASSWORD: ${{ secrets.CLOUDPLAY_TEST_PASSWORD }}
        run: |
          set -o pipefail
          python3 Scripts/prepare_simulator.py 2>&1 | tee build/logs/simulator-boot.log
          SIM_ID=$(cat build/simulator-id)
          xcodebuild test -workspace CloudPlay.xcworkspace -scheme CloudPlay -configuration Debug -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 90 -maximum-test-execution-time-allowance 120 -destination "platform=iOS Simulator,id=$SIM_ID" -derivedDataPath build/Simulator -resultBundlePath build/CloudPlayTests.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- 2>&1 | tee build/logs/ios-tests.log
      - name: 导出真实测试结果与截图
        if: always()
        run: |
          if [ -d build/CloudPlayTests.xcresult ]; then
            xcrun xcresulttool get test-results summary --path build/CloudPlayTests.xcresult > build/logs/test-summary.json
            xcrun xcresulttool export attachments --path build/CloudPlayTests.xcresult --output-path build/screenshots
          fi
      - name: 清理测试产物中的临时凭据
        if: always()
        env:
          CLOUDPLAY_REDACT_USER: ${{ secrets.CLOUDPLAY_TEST_USER }}
          CLOUDPLAY_REDACT_PASSWORD: ${{ secrets.CLOUDPLAY_TEST_PASSWORD }}
        run: python3 Scripts/redact_test_artifacts.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CloudPlay-test-logs
          path: |
            build/logs/
            build/screenshots/
          if-no-files-found: warn
